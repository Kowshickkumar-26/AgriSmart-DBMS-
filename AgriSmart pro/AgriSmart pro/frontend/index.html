<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AgriSmart — Login / Signup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?q=80&w=120&auto=format&fit=crop" alt="logo" />
        <h1>AgriSmart</h1>
        <p class="muted">Futuristic AgroTech dashboard</p>
      </div>

      <form id="authForm" class="auth-form">
        <h2 id="formTitle">Welcome Back</h2>
        <p id="formSubtitle">Log in to your AgriSmart account</p>

        <input id="username" placeholder="Username" required />
        <input id="email" placeholder="Email (signup only)" type="email" style="display:none" />
        <input id="password" placeholder="Password" type="password" required />
        <input id="confirmPassword" placeholder="Confirm password" type="password" style="display:none" />

        <button id="submitBtn" class="btn primary">Login</button>
        <div class="auth-footer">
          <button type="button" id="toggleBtn" class="btn ghost">Create account</button>
        </div>
      </form>

      <div class="auth-note">
        <small>Demo accounts (user: admin / pass: 123456)</small>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
