<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgriSmart – Signup</title>

<link rel="stylesheet" href="style.css" />

<style>
  body {
    margin: 0;
    font-family: "Poppins", sans-serif;
    background: url("https://images.unsplash.com/photo-1524593158962-7041a1a7da52?auto=format&fit=crop&w=1600&q=80")
      no-repeat center center/cover;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(3px);
  }

  .signup-card {
    width: 420px;
    padding: 30px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    text-align: center;
    backdrop-filter: blur(12px);
  }

  h1 {
    color: #fff;
    font-size: 32px;
  }

  p {
    color: #eee;
    font-size: 15px;
    margin-bottom: 20px;
  }

  input {
    width: 90%;
    padding: 12px;
    margin: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 15px;
  }

  .btn-signup {
    width: 95%;
    padding: 12px;
    background: #00a86b;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 10px;
    font-weight: 600;
  }

  .btn-signup:hover {
    background: #007e4d;
  }

  .link {
    color: #fff;
    margin-top: 15px;
    display: inline-block;
    cursor: pointer;
    font-size: 14px;
  }

  .link:hover {
    text-decoration: underline;
  }
</style>

</head>
<body>

<div class="signup-card">
  <h1>🌱 Join AgriSmart</h1>
  <p>Create your new account</p>

  <form id="signupForm">
    <input type="text" id="newUsername" placeholder="Choose Username" required />
    <input type="email" id="email" placeholder="Enter Email" required />
    <input type="password" id="newPassword" placeholder="Create Password" required />
    <button class="btn-signup">Signup</button>
  </form>

  <a href="index.html" class="link">Already have an account? Login</a>
</div>

<script src="script.js"></script>
</body>
</html>
